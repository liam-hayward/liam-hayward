<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="liam hayward, seo specialist. seo that works, technically.">
  <g font-family="Manrope, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- offset shadow -->
    <rect x="14" y="14" width="880" height="230" fill="#000000"/>

    <!-- card -->
    <rect x="6" y="6" width="880" height="230" fill="#EBEBEB" stroke="#000000" stroke-width="3"/>

    <!-- magnifier accent -->
    <g stroke="#000000" stroke-width="3.5" fill="none" stroke-linecap="round">
      <circle cx="806" cy="66" r="20"/>
      <line x1="821" y1="81" x2="838" y2="98"/>
    </g>

    <!-- name -->
    <text x="446" y="106" text-anchor="middle" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#000000">liam hayward</text>

    <!-- rotated yellow tag -->
    <g transform="rotate(-2 446 146)">
      <rect x="316" y="124" width="260" height="44" fill="#FFEE58" stroke="#000000" stroke-width="3"/>
      <text x="446" y="154" text-anchor="middle" font-size="24" font-weight="700" fill="#000000">seo specialist</text>
    </g>

    <!-- strapline -->
    <text x="446" y="209" text-anchor="middle" font-size="20" font-weight="500" fill="#333333">seo that works, technically.</text>

  </g>
</svg>
